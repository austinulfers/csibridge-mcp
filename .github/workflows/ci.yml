name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q

  # The install-free Windows build: embeddable Python + the package + launchers.
  portable:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write  # to attach the zip to the release
    env:
      PYTHON_VERSION: "3.12.10"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv build --wheel
      - run: scripts/build-portable.ps1 -Wheel (Get-ChildItem dist/*.whl).FullName -PythonVersion $env:PYTHON_VERSION
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: csibridge-mcp-portable-win64
          path: dist/csibridge-mcp-portable-win64.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/csibridge-mcp-portable-win64.zip
